[tox]
envlist = linters,py39
minversion = 2.3
skipsdist = True
stxdir = {toxinidir}/..

[testenv]
install_command = pip install -U \
    {opts} {packages} \
    -c{env:UPPER_CONSTRAINTS_FILE:https://opendev.org/starlingx/root/raw/branch/master/build-tools/requirements/debian/upper-constraints.txt}

setenv =
   VIRTUAL_ENV={envdir}
   OS_STDOUT_CAPTURE=1
   OS_STDERR_CAPTURE=1
   OS_DEBUG=1
   OS_LOG_CAPTURE=1
deps =
  -r{toxinidir}/test-requirements.txt
allowlist_externals =
  bash

[testenv:py39]
usedevelop = True
setenv =
    TESTPATH=./notificationservice-base-v2/ptptrackingfunction/trackingfunctionsdk/tests/
commands =
    # Run all tests with comprehensive summary
    python -m pytest notificationservice-base-v2/ptptrackingfunction -v --tb=short -ra --durations=10
deps =
    -r{toxinidir}/test-requirements.txt
    wsme
    oslo.utils
    oslo.messaging
    pecan
    pytest

[testenv:bashate]
basepython = python3
# Treat all E* codes as Errors rather than warnings using: -e 'E*'
commands =
  bash -c "find {toxinidir}                    \
         -not \( -type d -name .?\* -prune \) \
         -type f                              \
         -not -name \*~                       \
         -not -name \*.md                     \
         -name \*.sh                          \
         -print0 | xargs -r -n 1 -0 bashate -v   \
         -e 'E*'"

[testenv:linters]
basepython = python3
install_command = pip install -U {opts} {packages}
deps =
    bashate >= 0.2
commands =
    {[testenv:bashate]commands}

[testenv:docs]
basepython = python3
install_command = pip install -U {opts} {packages}
deps = -r{toxinidir}/doc/requirements.txt
commands =
    rm -rf doc/build
    sphinx-build -a -E -W -d doc/build/doctrees -b html doc/source doc/build/html
allowlist_externals = rm

[testenv:api-ref]
basepython = python3
install_command = pip install -U {opts} {packages}
deps = -r{toxinidir}/doc/requirements.txt
commands =
  rm -rf api-ref/build
  sphinx-build -W -b html -d api-ref/build/doctrees api-ref/source api-ref/build/html
allowlist_externals = rm

[testenv:pylint]
basepython = python3
description = Dummy environment to allow pylint to be run in subdir tox

[testenv:flake8]
basepython = python3
description = Dummy environment to allow flake8 to be run in subdir tox

[testenv:metadata]
basepython = python3
description = Dummy environment to allow sysinv-app to be run in subdir tox

[testenv:coverage]
basepython = python3
usedevelop = True
install_command = pip install -U {opts} {packages}
setenv =
    VIRTUAL_ENV={envdir}
deps =
    wsme
    oslo.utils
    oslo.messaging
    pecan
    pytest
    pytest-cov
    netaddr
    mock
    PyYAML
    watchdog
    {toxinidir}/../integ/python/pynetlink/src
commands =
    bash -c "mkdir -p {toxinidir}/UTCoverage"
    bash -c "python -m pytest \
        notificationservice-base-v2/ptptrackingfunction \
        tests/ \
        -v --tb=short -ra \
        --cov=notificationservice-base-v2/ptptrackingfunction/trackingfunctionsdk/client \
        --cov=notificationservice-base-v2/ptptrackingfunction/trackingfunctionsdk/common \
        --cov=notificationservice-base-v2/ptptrackingfunction/trackingfunctionsdk/model \
        --cov=notificationservice-base-v2/ptptrackingfunction/trackingfunctionsdk/services \
        --cov=notificationservice-base-v2/ptptrackingfunction/trackingfunctionsdk/__init__.py \
        --cov-report=term-missing \
        --cov-report=html:{toxinidir}/UTCoverage/htmlcov \
        --cov-report=xml:{toxinidir}/UTCoverage/coverage.xml \
        --cov-fail-under=70 \
        --ignore=notificationservice-base-v2/ptptrackingfunction/trackingfunctionsdk/tests \
        2>&1 | tee {toxinidir}/UTCoverage/coverage_report.txt"
allowlist_externals =
    bash

[testenv:security]
basepython = python3
install_command = pip install -U {opts} {packages}
deps =
    bandit
commands =
    bash -c "mkdir -p {toxinidir}/UTCoverage"
    bash -c "bandit -r \
        notificationservice-base-v2/ptptrackingfunction/trackingfunctionsdk \
        python3-k8sapp-ptp-notification/k8sapp_ptp_notification/k8sapp_ptp_notification \
        -f txt -o {toxinidir}/UTCoverage/security_report.txt \
        --skip B101,B104,B110,B602,B603,B607 \
        -ll"
    bash -c "bandit -r \
        notificationservice-base-v2/ptptrackingfunction/trackingfunctionsdk \
        python3-k8sapp-ptp-notification/k8sapp_ptp_notification/k8sapp_ptp_notification \
        -f json -o {toxinidir}/UTCoverage/bandit-report.json \
        --skip B101,B104,B110,B602,B603,B607 \
        -ll"
allowlist_externals =
    bash

[testenv:py313]
basepython = python3.13
usedevelop = True
setenv =
