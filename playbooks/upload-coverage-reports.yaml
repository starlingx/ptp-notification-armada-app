- hosts: all
  tasks:
    - name: Check coverage directory exists
      stat:
        path: "{{ zuul.project.src_dir }}/UTCoverage/"
      register: coverage_dir_stat
    - name: Upload coverage reports
      synchronize:
        src: "{{ zuul.project.src_dir }}/UTCoverage/"
        dest: "{{ zuul.executor.log_root }}/coverage/"
        mode: pull
      when: coverage_dir_stat.stat.exists
    - name: Return coverage report URL
      zuul_return:
        data:
          zuul:
            artifacts:
              - name: "Coverage Report"
                url: "coverage/htmlcov/index.html"
      when: coverage_dir_stat.stat.exists
